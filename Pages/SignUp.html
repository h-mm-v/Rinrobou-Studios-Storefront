<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../src/assets/logo-small.png">
    <title>Sign Up</title>
</head>


<body>
    <header class="navbar">
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#catalog">Catalog</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#about">About Us</a>
        </nav>

        <a href="#home" class="nav-logo">
            <img src="../src/assets/logo-small.png" alt="RinRobou Studios" />
        </a>

        <div class="nav-icons">
            <button class="icon-button" aria-label="Account">
                <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M5 20c.8-3.5 3.2-5.5 7-5.5s6.2 2 7 5.5"></path>
                </svg>
            </button>
            <button aria-label="Search">⌕</button>
            <button aria-label="Shopping cart">🛒</button>
        </div>
    </header>

    <main class="signUpBackground">
        <form class="signUpContainer" action="../homepage.html" method="get">
            <h1>Sign Up</h1>

            <label for "email">Email Address</label>
            <div class="form-field">
                <input id="email" name="email" type="email" placeholder="example@email.com" required>
            </div>


            <label for "password">Password</label>
            <div class="form-field">
                <input id="password" name="password" type="password" placeholder="Password123!!" required>
            </div>

            <label for "confirm-password">Re-Enter Password</label>
            <div class="form-field">
                <input id="confirm-password" name="confirm-password" type="password" placeholder="Password123!!"
                    required>
            </div>

            <label class="terms" for="terms">
                <input type="checkbox" class="Checkbox" required>
                I agree to <a href="/terms-of-service.html">terms and services</a>
            </label>

            <button type="submit" class="button">Confirm</button>

            <!--Need to connect to Sign In Page-->

            <p class="login">Already have an account? <a href="../login.html">Log in</a></p>

        </form>
    </main>

    <footer class="footer" id="about">
        <div>
            <img src="../src/assets/logo-large.png" alt="RinRobou Studios" class="footer-logo" />

            <div class="footer-columns">
                <div>
                    <strong>(951)-208-5524</strong>
                    <p>rinroboustudios@gmail.com</p>
                    <p>Burbank, CA</p>
                </div>

                <div>
                    <strong>Business Hours</strong>
                    <p>MONDAY - FRIDAY</p>
                    <p>9:00 AM - 5:00 PM</p>
                </div>
            </div>
        </div>
        <img src="../src/assets/footer-art.png" alt="Character artwork" class="footer-art" />
        <small>©2027 RinRobou Studios, All Rights Reserved</small>
    </footer>
</body>

</html>
