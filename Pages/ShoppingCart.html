<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../src/assets/logo-small.png">
    <title>Shopping Cart</title>
</head>


<body>
    <header class="navbar">
        <nav class="nav-links">
            <a href="../homepage.html">Home</a>
            <a href="../catalog.html">Catalog</a>
            <a href="../portfolio.html">Portfolio</a>
            <a href="/AboutUsPage.html">About Us</a>
        </nav>

        <a href="../homepage.html" class="nav-logo">
            <img src="../src/assets/logo-small.png" alt="RinRobou Studios" />
        </a>

        <div class="nav-icons">
            <a href="/login.html" class="icon-button" aria-label="Account">
                <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M5 20c.8-3.5 3.2-5.5 7-5.5s6.2 2 7 5.5"></path>
                </svg>
            </a>
            <a href="/SearchResultsPage.html" class="icon-button" aria-label="Search">⌕</a>
            <a href="/Pages/ShoppingCart.html" class="icon-button" aria-label="Shopping cart" aria-current="page">🛒</a>
        </div>
    </header>

    <main class="ShoppingCart-Background">
        <div class="ShoppingCartContainer">
            <h1>Your Cart</h1>
            <a href="/catalog.html">Continue shopping</a>
            <label class="CheckBox">
                Select all
                <input type="checkbox" class="Checkbox" id="select-all-cart-items" disabled>
            </label>
        </div>
        <hr class="ShoppingCartTopDivider">
        <div class="cart-layout">
            <div class="cart-content">
                <div id="cart-items" aria-live="polite"></div>
                <p id="cart-page-status" role="status" aria-live="polite"></p>
            </div>

            <form class="CheckOutForm" id="cart-checkout-form">
                <div class="CheckoutSubtotal">
                    <p>
                        Subtotal (<span id="cart-item-count">0</span>): <span id="cart-subtotal">$0.00</span>
                    </p>
                </div>
                <div class="ProceedToCheckoutButton">
                    <button type="submit" class="button" disabled>Proceed to Checkout</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer" id="about">
        <div class="footer-brand">
            <img src="../src/assets/logo-large.png" alt="RinRobou Studios" class="footer-logo" />

            <div class="footer-columns">
                <div>
                    <strong>(951)-208-5524</strong>
                    <p>rinroboustudios@gmail.com</p>
                    <p>Burbank, CA</p>
                </div>

                <div>
                    <strong>Business Hours</strong>
                    <p>MONDAY - FRIDAY</p>
                    <p>9:00 AM - 5:00 PM</p>
                </div>
            </div>

            <div class="social-links">
                <a href="#" aria-label="X">X</a>
                <a href="#" aria-label="Instagram">◎</a>
                <a href="#" aria-label="Pinterest">P</a>
            </div>
        </div>

        <img src="../src/assets/footer-art.png" alt="RinRobou character artwork" class="footer-art" />

        <small>©2027 RinRobou Studios, All Rights Reserved</small>
    </footer>
    <script type="module" src="/storefront-cart.js"></script>
</body>

</html>
