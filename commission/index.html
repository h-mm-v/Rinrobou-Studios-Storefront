  <link rel="stylesheet" href="/commission/commission.css">
</head>
<body>

    <nav class="nav-links">
      <a href="/homepage.html">Home</a>
      <a href="/catalog.html">Catalog</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/AboutUsPage.html">About Us</a>
    </nav>

    <a href="/homepage.html" class="nav-logo">
      <img src="/src/assets/logo-small.png" alt="RinRobou Studios" />
    </a>

    <div class="nav-icons">
      <a href="/login.html">
        <button class="icon-button" aria-label="Account">
          <svg
            width="16"
            height="16"
            stroke-width="1"
            viewBox="0 0 24 24"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20c.8-3.5 3.2-5.5 7-5.5s6.2 2 7 5.5"></path>
          </svg>
        </button>
      </a>
      <a href="/SearchResultsPage.html">
        <button aria-label="Search">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            viewBox="0 0 24 24"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </a>
      <a href="/Pages/ShoppingCart.html">
        <button aria-label="Shopping cart">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="8" cy="21" r="1"></circle>
            <circle cx="19" cy="21" r="1"></circle>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
          </svg>
        </button>
      </a>
    </div>
  </header>

  <main>
    <div class="commission-layout">
      <form id="request-form" class="request-form" action="/api/commissions" method="post" enctype="multipart/form-data">
        <div>
          <label class="field-label" for="commission-description">Description of Commission <span class="required-mark" aria-hidden="true">✦</span></label>
          <textarea class="field-control" id="commission-description" name="description" placeholder="Insert details of commission here..." maxlength="10000" required></textarea>
        </div>

        <div>
          <input class="file-input" id="reference-files" name="references" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif,image/bmp,.pdf" multiple aria-labelledby="reference-label">
          <span class="sr-only" id="reference-label">Attach references and files</span>
          <label class="file-control" for="reference-files">
            <span class="file-button" aria-hidden="true">✧ &nbsp; Attach References and Files</span>
            <span class="sr-only">Choose reference files</span>
          </label>
          <p class="file-help">Images and PDF files are welcome.</p>
        </div>

        <label class="check-row" for="physical-commission">
          <input id="physical-commission" name="physical-commission" type="checkbox">
          <span>Physical Commission?</span>
        </label>

        <div>
          <label class="field-label" for="preferred-deadline">Preferred Deadline <span class="required-mark" aria-hidden="true">✦</span></label>
          <input class="field-control" id="preferred-deadline" name="deadline" type="date" required>
        </div>

        <div>
          <span class="section-label">Contact Information <span class="required-mark" aria-hidden="true">✦</span></span>
          <div class="contact-fields">
            <label>
              <span class="sr-only">Email address</span>
              <input class="field-control" name="email" type="email" maxlength="254" placeholder="your@email.com" autocomplete="email" required>
            </label>
            <label>
              <span class="sr-only">Phone number (optional)</span>
              <input class="field-control" name="phone" type="tel" maxlength="40" placeholder="+1 (***)-***-**** (Optional)" autocomplete="tel">
            </label>
          </div>
        </div>

        <div class="check-list-and-terms">
          <div class="check-list">
            <label class="check-row">
              <input name="request-acknowledgement" type="checkbox" required>
              <span>I understand that sending this request does not guarantee the commission will be accepted.</span>
            </label>
            <label class="check-row">
              <input name="terms-accepted" type="checkbox" required>
              <span>I accept Rinrobou Studio's Terms of Service.</span>
            </label>
          </div>
          <a class="commission-terms-link" href="/terms-of-service.html" target="_blank" rel="noopener noreferrer" aria-label="Read the Terms of Service">
            <img src="/src/assets/ToS-link.png" alt="">
          </a>
        </div>

        <button class="submit-button" type="submit">Send Request</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer class="footer" id="about">
    <div>
      <img src="/src/assets/logo-large.png" alt="RinRobou Studios" class="footer-logo" />

      <div class="footer-columns">
        <div>
          <strong>(951)-208-5524</strong>
          <p>rinroboustudios@gmail.com</p>
          <p>Burbank, CA</p>
        </div>

        <div>
          <strong>Business Hours</strong>
          <p>MONDAY - FRIDAY</p>
          <p>9:00 AM - 5:00 PM</p>
        </div>
      </div>
    </div>

    <img src="/src/assets/footer-art.png" alt="Character artwork" class="footer-art" />

    <small>©2027 RinRobou Studios, All Rights Reserved</small>
  </footer>
  <script type="module" src="/commission/commission-client.js"></script>
</body>
</html>
