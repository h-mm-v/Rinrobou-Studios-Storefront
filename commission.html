<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#20082B">
  <title>Commission Request | Rinrobou Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="commission.css">
</head>
<body>
  <header class="navbar">
      <nav class="nav-links">
        <a href="homepage.html">Home</a>
        <a href="catalog.html">Catalog</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="src/pages/AboutUsPage.tsx">About Us</a>
      </nav>

      <a href="index.html" class="nav-logo">
        <img src="src/assets/logo-small.png" alt="RinRobou Studios" />
      </a>

      <div class="nav-icons">
        <button class="icon-button" aria-label="Account">
          <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
          >
              <circle cx="12" cy="8" r="3.5"></circle>
              <path d="M5 20c.8-3.5 3.2-5.5 7-5.5s6.2 2 7 5.5"></path>
          </svg>
        </button>
        <button aria-label="Search">⌕</button>
        <button aria-label="Shopping cart">🛒</button>
      </div>
  </header>

  <main>
    <div class="commission-layout">
      <form class="request-form">
        <div>
          <label class="field-label" for="commission-description">Description of Commission <span class="required-mark" aria-hidden="true">✦</span></label>
          <textarea class="field-control" id="commission-description" name="description" placeholder="Insert details of commission here..." required></textarea>
        </div>

        <div>
          <input class="file-input" id="reference-files" name="references" type="file" accept="image/*,.pdf" multiple aria-labelledby="reference-label">
          <span class="sr-only" id="reference-label">Attach references and files</span>
          <label class="file-control" for="reference-files">
            <span class="file-button" aria-hidden="true">✧ &nbsp; Attach References and Files</span>
            <span class="sr-only">Choose reference files</span>
          </label>
          <p class="file-help">Images and PDF files are welcome.</p>
        </div>

        <label class="check-row" for="physical-commission">
          <input id="physical-commission" name="physical-commission" type="checkbox">
          <span>Physical Commission?</span>
        </label>

        <div>
          <label class="field-label" for="preferred-deadline">Preferred Deadline <span class="required-mark" aria-hidden="true">✦</span></label>
          <input class="field-control" id="preferred-deadline" name="deadline" type="date">
        </div>

        <div>
          <span class="section-label">Contact Information <span class="required-mark" aria-hidden="true">✦</span></span>
          <div class="contact-fields">
            <label>
              <span class="sr-only">Email address</span>
              <input class="field-control" name="email" type="email" placeholder="your@email.com" autocomplete="email" required>
            </label>
            <label>
              <span class="sr-only">Phone number (optional)</span>
              <input class="field-control" name="phone" type="tel" placeholder="+1 (***)-***-**** (Optional)" autocomplete="tel">
            </label>
          </div>
        </div>

        <div class="check-list">
          <label class="check-row">
            <input name="request-acknowledgement" type="checkbox" required>
            <span>I understand that sending this request does not guarantee the commission will be accepted.</span>
          </label>
          <label class="check-row">
            <input name="terms-accepted" type="checkbox" required>
            <span>I accept Rinrobou Studio's Terms of Service.</span>
          </label>
        </div>

        <button class="submit-button" type="submit">Send Request</button>
      </form>
    </div>
  </main>

  <footer class="footer" id="about">
    <div>
      <img src="src/assets/logo-large.png" alt="RinRobou Studios" class="footer-logo" />

      <div class="footer-columns">
        <div>
          <strong>(951)-208-5524</strong>
          <p>rinroboustudios@gmail.com</p>
          <p>Burbank, CA</p>
        </div>

        <div>
          <strong>Business Hours</strong>
          <p>MONDAY - FRIDAY</p>
          <p>9:00 AM - 5:00 PM</p>
        </div>
      </div>
    </div>

    <img src="src/assets/footer-art.png" alt="Character artwork" class="footer-art" />

    <small>©2027 RinRobou Studios, All Rights Reserved</small>
  </footer>
</body>
</html>
