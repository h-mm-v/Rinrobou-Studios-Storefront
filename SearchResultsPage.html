  <style>
    .search-results-page {
      width: min(86%, 1100px);
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .catalog-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 54px;
      gap: 14px;
      margin-bottom: 16px;
    }

    .catalog-brand {
      width: 110px;
      height: 52px; 
      object-fit: contain;
    }

    .categories-button {
      border: 0;
      background: transparent;
      color: var(--white);
      font-size: 18px;
      text-align: left;
      white-space: nowrap;
    }

    .search-box {
      display: flex;
      height: 46px;
      overflow: hidden;
      border: 3px solid var(--dark);
      border-radius: 18px;
      background: #dedede;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 0 20px;
      background: transparent;
      color: #222;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #555;
    }

    .search-submit {
      width: 54px;
      border: 0;
      border-radius: 50%;
      background: var(--mint);
      color: white;
      font-size: 25px;
    }

    .filters-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .filter-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-chip {
      border: 0;
      border-radius: 18px;
      padding: 8px 16px;
      background: #dedede;
      color: #171717;
      white-space: nowrap;
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 5px;
      color: white;
      white-space: nowrap;
      font-size: 13px;
    }

    .sort-control select {
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font: inherit;
    }

    .sort-control option {
      color: #222;
    }

    .search-results-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px 34px;
    }

    .search-results-grid .product-card > img {

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
    } 

    .pagination button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #dedede;
      color: #222;
      font-weight: bold;
    }

    /* New CSS for filters */
    .filter-panel {
      position: fixed;
      z-index: 1001;
      top: 60px;
      bottom: 0;
      left: 0;

      width: 310px;
      max-width: 88vw;
      padding: 26px 28px;

      overflow-y: auto;
      background: #0c0917;
      color: white;
      box-shadow: 8px 0 20px rgba(0, 0, 0, 0.4);

      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .filter-panel.open {
      transform: translateX(0);
    }

    .filter-overlay {
      position: fixed;
      z-index: 1000;
      inset: 60px 0 0;

      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .filter-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .filter-panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid #777;
    }

    .filter-panel-header span {
      margin-right: auto;
      font-weight: bold;
    }

    .reset-filters,
    .close-filters {
      border: none;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .reset-filters {
      color: var(--mint);
      text-decoration: underline;
    }

    .reset-filters:hover,
    .close-filters:hover {
      color: var(--pink);
    }

    .filter-group {
      border-bottom: 1px solid #777;
    }

    .filter-group summary {
      display: flex;
      justify-content: space-between;
      padding: 17px 0;
      cursor: pointer;
      list-style: none;
    }

    .filter-group summary::-webkit-details-marker {
      display: none;
    }

    .filter-group summary::after {
      content: "▼";
      font-size: 10px;
    }

    .filter-group label {
      display: flex;
      gap: 9px;
      padding: 7px 0;
      color: #d9d9d9;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-group label:hover {
      color: var(--mint);
    }

    .filter-group input {
      accent-color: var(--mint);
    }

    .apply-filters {
      width: 100%;
      margin-top: 24px;
      padding: 12px;

      border: none;
      border-radius: 8px;
      background: var(--mint);
      color: #155b57;
      font-weight: bold;
      cursor: pointer;
    }

    .apply-filters:hover {
      background: var(--pink);
      color: white;
    }
    /* end */
    .pagination .active-page {
      background: #23d6c2;
      color: white;
    }

   @media (max-width: 800px) {
    .catalog-tools {
      grid-template-columns: minmax(0, 1fr) 54px;
    }

    .search-box {
      grid-column: 1;
      grid-row: 1;

    .filters-row {

    }

    .search-results-grid {

    }
  }

    <script>
      const filterButton = document.getElementById("all-filters-button");
      const filterPanel = document.getElementById("filter-panel");
      const filterOverlay = document.getElementById("filter-overlay");
      const closeFilters = document.getElementById("close-filters");
      const resetFilters = document.getElementById("reset-filters");
      const applyFilters = document.getElementById("apply-filters");
      const advancedFilters = document.getElementById("advanced-filters");

      function openFilters() {
        filterPanel.classList.add("open");
        filterOverlay.classList.add("visible");

        filterButton.setAttribute("aria-expanded", "true");
        filterPanel.setAttribute("aria-hidden", "false");
      }

      function closeFilterPanel() {
        filterPanel.classList.remove("open");
        filterOverlay.classList.remove("visible");

        filterButton.setAttribute("aria-expanded", "false");
        filterPanel.setAttribute("aria-hidden", "true");
      }

      filterButton.addEventListener("click", openFilters);
      closeFilters.addEventListener("click", closeFilterPanel);
      filterOverlay.addEventListener("click", closeFilterPanel);

      advancedFilters.addEventListener("submit", function (event) {
        event.preventDefault();

        const formData = new FormData(advancedFilters);
        const filters = {};

        const category = formData.get("category");
        const format = formData.get("format");
        const popular = formData.get("popular");
        const price = formData.get("price");
        const color = formData.get("color");

        if (category) filters.category = category;
        if (format) filters.format = format;
        if (color) filters.color = color;
        if (price) filters.maxPrice = price;

        if (popular === "best-sellers" || popular === "five-stars") {
          filters.popular = popular;
        }

        if (popular === "limited-time") {
          filters.limitedTime = "true";
        }

        loadProducts(1, filters);
        closeFilterPanel();
      });

      resetFilters.addEventListener("click", function () {
        advancedFilters.reset();
        loadProducts(1, {});
      });

      advancedFilters.querySelectorAll("input[type='checkbox']").forEach((input) => {
        input.addEventListener("change", () => {
          if (!input.checked) return;

          advancedFilters
            .querySelectorAll(`input[name='${input.name}']`)
            .forEach((otherInput) => {
              if (otherInput !== input) {
                otherInput.checked = false;
              }
            });
        });
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeFilterPanel();
        }
      });
    </script>

    <!--Categories dropdown code-->
    <script>
        const categoriesButton = document.getElementById("categories-button");
        const categoriesDropdown =
            document.getElementById("categories-dropdown");

        categoriesButton.addEventListener("click", function (event) {
            event.stopPropagation();

            const isOpen = categoriesDropdown.classList.toggle("open");

            categoriesButton.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
            );
        });

        document.addEventListener("click", function () {
            categoriesDropdown.classList.remove("open");
            categoriesButton.setAttribute("aria-expanded", "false");
        });
    </script>

    <script>
      const API_URL = "http://localhost:3000/api/products";

      const productGrid = document.getElementById("product-grid");
      const searchInput = document.getElementById("search-input");
      const sortProducts = document.getElementById("sort-products");
      const pagination = document.querySelector(".pagination");

      let currentPage = 1;
      let activeFilters = {};

      async function loadProducts(page = 1, filters = {}) {
        currentPage = page;
        activeFilters = filters;

        const params = new URLSearchParams();

        params.set("page", page);
        params.set("pageSize", "12");

        if (searchInput.value.trim()) {
          params.set("search", searchInput.value.trim());
        }

        if (sortProducts.value) {
          params.set("sort", sortProducts.value);
        }

        Object.entries(filters).forEach(([key, value]) => {
          if (value !== "") {
            params.set(key, value);
          }
        });

        productGrid.innerHTML = "<p>Loading products...</p>";

        try {
          const response = await fetch(`${API_URL}?${params.toString()}`);

          if (!response.ok) {
            throw new Error("Could not load products.");
          }

          const data = await response.json();

          renderProducts(data.products);
          renderPagination(data.page, data.totalPages);
        } catch (error) {
          console.error(error);
          productGrid.innerHTML =
            "<p>Unable to load products. Make sure your backend is running.</p>";
        }
      }

      function renderProducts(products) {
        productGrid.innerHTML = "";

        if (products.length === 0) {
          productGrid.innerHTML = "<p>No products matched your filters.</p>";
          return;
        }

        products.forEach((product) => {
          const card = document.createElement("article");

          card.className = "product-card";

          card.innerHTML = `
            <img
              src="${product.image_path}"
              alt="${product.name}"
            />

            <div class="product-info">
              <p class="product-label">
                ${product.badge || ""}
              </p>

              <h3>${product.name}</h3>

              <p class="rating">
                ★★★★★
                <span>(${product.review_count})</span>
              </p>

              <p class="price">$${Number(product.price).toFixed(2)}</p>

              <button class="card-button" type="button">
                ADD TO BAG
              </button>
            </div>
          `;

          productGrid.appendChild(card);
        });
      }

      function renderPagination(page, totalPages) {
        pagination.innerHTML = "";

        const previousButton = document.createElement("button");
        previousButton.textContent = "←";
        previousButton.disabled = page === 1;

        previousButton.addEventListener("click", () => {
          loadProducts(page - 1, activeFilters);
        });

        pagination.appendChild(previousButton);

        for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
          const pageButton = document.createElement("button");

          pageButton.textContent = pageNumber;

          if (pageNumber === page) {
            pageButton.classList.add("active-page");
          }

          pageButton.addEventListener("click", () => {
            loadProducts(pageNumber, activeFilters);
          });

          pagination.appendChild(pageButton);
        }

        const nextButton = document.createElement("button");
        nextButton.textContent = "→";
        nextButton.disabled = page === totalPages;

        nextButton.addEventListener("click", () => {
          loadProducts(page + 1, activeFilters);
        });

        pagination.appendChild(nextButton);
      }

      searchInput.addEventListener("input", () => {
        loadProducts(1, activeFilters);
      });

      sortProducts.addEventListener("change", () => {
        loadProducts(1, activeFilters);
      });

      document.querySelectorAll(".quick-filter").forEach((button) => {
        button.addEventListener("click", () => {
          const filterName = button.dataset.filter;
          const filterValue = button.dataset.value;

          activeFilters = {
            [filterName]: filterValue
          };

          loadProducts(1, activeFilters);
        });
      });

      document.querySelectorAll("#categories-dropdown a").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();

          const url = new URL(link.href);
          const category = url.searchParams.get("category");

          activeFilters = { category };
          loadProducts(1, activeFilters);
        });
      });

      document.querySelector(".search-box").addEventListener("submit", (event) => {
        event.preventDefault();
        loadProducts(1, activeFilters);
      });

      loadProducts();
    </script>
</body>
