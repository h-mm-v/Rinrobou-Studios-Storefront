<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RinRobou Studios</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header class="navbar">
    <nav class="nav-links">
      <a href="homepage.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="src/pages/AboutUsPage.tsx">About Us</a>
    </nav>

    <a href="homepage.html" class="nav-logo">
      <img src="src/assets/logo-small.png" alt="RinRobou Studios" />
    </a>

    <div class="nav-icons">
      <button class="icon-button" aria-label="Account">
        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20c.8-3.5 3.2-5.5 7-5.5s6.2 2 7 5.5"></path>
        </svg>
      </button>
      <button aria-label="Search">⌕</button>
      <button aria-label="Shopping cart">🛒</button>
    </div>
  </header>
  <main>
    <section class="login-page">

      <!-- Left: Character Artwork -->
      <div class="login-artwork">
        <img
          src="./src/assets/rinspecialbase.png"
          alt="Rinrobou Studios character"
          class="login-character"
        >
      </div>

      <!-- Right: Login Form -->
      <div class="login-form-container">

        <h1 class="login-title">Log In</h1>

        <form id="login-form">

          <!-- Email -->
          <div class="login-field">
            <label for="login-email">Email Address</label>

            <input
              type="email"
              id="login-email"
              placeholder="example@email.com"
              autocomplete="email"
              required
            >
          </div>

          <!-- Password -->
          <div class="login-field">
            <label for="login-password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="login-password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="toggle-password"
                class="password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg
                  id="eye-icon"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Forgot Password -->
          <a href="#" class="forgot-password">
            Forgot Password?
          </a>

          <!-- Login Button -->
          <button type="submit" class="login-submit">
            Log In
          </button>

          <p id="login-message"
             class="login-message"
             role="status"></p>

        </form>

        <!-- Sign Up -->
        <p class="signup-prompt">
          No Account?
          <a href="/Pages/SignUp.html">Sign Up</a>
        </p>

      </div>
    </section>
  </main>
  <footer class="footer" id="about">
      <div class="footer-brand">
        <img
          src="src/assets/logo-large.png"
          alt="RinRobou Studios"
          class="footer-logo"
        />

        <div class="footer-columns">
          <div>
            <strong>(951)-208-5524</strong>
            <p>rinroboustudios@gmail.com</p>
            <p>Burbank, CA</p>
          </div>

          <div>
            <strong>Business Hours</strong>
            <p>MONDAY - FRIDAY</p>
            <p>9:00 AM - 5:00 PM</p>
          </div>
        </div>

        <div class="social-links">
          <a href="#" aria-label="X">X</a>
          <a href="#" aria-label="Instagram">◎</a>
          <a href="#" aria-label="Pinterest">P</a>
        </div>
      </div>

      <img
        src="src/assets/footer-art.png"
        alt="RinRobou character artwork"
        class="footer-art"
      />

      <small>©2027 RinRobou Studios, All Rights Reserved</small>
  </footer>
</body>
</html>
